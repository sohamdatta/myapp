services:
  app:
    image: mcr.microsoft.com/devcontainers/java:1-21-bookworm
    volumes:
      - ../..:/workspaces:cached
    # Keeps the container running so the editor can attach to it.
    command: sleep infinity
    # Shares the database container's network, so PostgreSQL is at localhost:5432.
    network_mode: service:db
    depends_on:
      - db

  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Development-only credentials for the database inside the codespace.
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: myapp

volumes:
  postgres-data:
