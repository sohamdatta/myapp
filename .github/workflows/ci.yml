# Runs every automated check on each push to main and on each pull request:
#   backend   Maven build and the JUnit tests against a real PostgreSQL 16
#   frontend  lint and production build
#   browser   the app started from the backend jar, then the Playwright suites
#   deploy    the deployment images built and started as on a server, against a
#             PostgreSQL whose admin login is not a superuser (as on AWS)
#   deploy-oci the demo / UAT setup (PostgreSQL and backup on the server), as on OCI
# A failing job marks the commit red and GitHub emails the person who pushed.
#
# To save Actions minutes (the repository is private): a change to documentation only
# runs nothing, and on pull requests the browser tests run in UTC only; main runs them in
# both time zones. Run it by hand (Actions > CI > Run workflow) for the full set on any branch.
# When main passes, deploy-uat.yml deploys it to the UAT server.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.devcontainer/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.devcontainer/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Fail, rather than skip, the database tests if PostgreSQL cannot be reached.
      APP_TEST_DB_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
      - name: Summarise coverage
        working-directory: backend
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open('target/site/jacoco/jacoco.csv')))
          g = lambda k: sum(int(r[k]) for r in rows)
          line = 100 * g('LINE_COVERED') / (g('LINE_COVERED') + g('LINE_MISSED'))
          branch = 100 * g('BRANCH_COVERED') / (g('BRANCH_COVERED') + g('BRANCH_MISSED'))
          print(f"### Backend test coverage\n\nLines {line:.1f}% · branches {branch:.1f}% (backend tests only; the browser tests cover the web layer)")
          EOF
      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 14
      - name: Keep the application jar for the browser tests
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/login-app-*.jar
          retention-days: 3

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e-dates:
    # A browser test that steps more than five days from today can cross a month or tax-year end
    # on some days only. Checks the lines a pull request adds; see e2e/check-dates.mjs.
    name: Browser-test dates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node e2e/check-dates.mjs origin/${{ github.base_ref }}

  browser:
    # Twice: in UTC, and with the database and the server in India time, as many customers run them.
    # Dates and times that are right in one zone and wrong in the other fail here, not in production.
    name: Browser tests (${{ matrix.zone.name }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: UTC only, as the servers run. main and manual runs: both zones.
        zone: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"name":"UTC","tz":"UTC","slug":"utc"}]'
          || '[{"name":"UTC","tz":"UTC","slug":"utc"},{"name":"India time","tz":"Asia/Kolkata","slug":"ist"}]') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms
          TZ: ${{ matrix.zone.tz }}
          PGTZ: ${{ matrix.zone.tz }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: dist-backend

      - name: Start the backend
        run: |
          TZ=${{ matrix.zone.tz }} nohup java -jar dist-backend/login-app-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me || true)
            if [ "$code" = "401" ]; then echo "backend is up"; exit 0; fi
            sleep 2
          done
          echo "backend did not start"; cat backend.log; exit 1

      - name: Start the frontend
        working-directory: frontend
        run: |
          npm ci
          nohup npx vite --port 5173 > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ > /dev/null; then echo "frontend is up"; exit 0; fi
            sleep 1
          done
          echo "frontend did not start"; cat ../frontend.log; exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: e2e
        run: npx playwright test

      - name: Keep the report, screenshots and recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.zone.slug }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            backend.log
            frontend.log
          retention-days: 14

  deploy:
    name: Deployment images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the server setup
        working-directory: deploy
        run: |
          cat > .env <<EOF
          DOMAIN=http://localhost
          APP_DB_URL=jdbc:postgresql://db:5432/hrms
          APP_DB_OWNER_USER=dbmasteruser
          APP_DB_OWNER_PASSWORD=ci-master
          APP_DB_ROLE_PASSWORD=$(openssl rand -hex 16)
          APP_SUPERADMIN_EMAIL=admin@example.com
          APP_SUPERADMIN_PASSWORD=ChangeMe-12345
          APP_DATA_KEY=$(openssl rand -base64 32)
          APP_REQUIRE_DATA_KEY=true
          APP_TRUST_FORWARDED_FOR=true
          EOF
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait --wait-timeout 300

      - name: Check it answers through the web server
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/auth/me)" = 401
          curl -sf http://localhost/ | grep -q '<div id="root">'
          curl -sf http://localhost/some/screen | grep -q '<div id="root">'
          # Signing in as the Super Admin works end to end.
          curl -sf -X POST http://localhost/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ChangeMe-12345"}' | grep -q token
          # Biometric devices reach the app, on the site and on the plain-HTTP device port;
          # an unregistered serial number is turned away by the app itself.
          curl -s 'http://localhost/iclock/cdata?SN=CI-UNKNOWN-1' | grep -q device.unknown
          curl -s 'http://localhost:8081/iclock/cdata?SN=CI-UNKNOWN-1' | grep -q device.unknown
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/)" = 404
          # The app's roles have no way around row-level security.
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml exec -T db \
            psql -U postgres -d hrms -Atc "select count(*) from pg_roles where rolname like 'app_%' and (rolbypassrls or rolsuper)" | grep -qx 0

      - name: Migration dry run, as before a production deploy
        working-directory: deploy
        run: |
          # The command docs/deploy/aws-lightsail.md has the operator run before starting a new build.
          out=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm --no-deps -T app --check-migrations)
          echo "$out"
          echo "$out" | grep -q "No migrations to apply."
          echo "$out" | grep -q "Applied migrations match their files."

      - name: Show the logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml logs --no-color | tail -200

  deploy-oci:
    # The demo / UAT setup on Oracle Cloud: the same images plus PostgreSQL and the nightly
    # backup on the server itself (docs/deploy/oracle-cloud-uat.md).
    name: Deployment images (OCI demo / UAT)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the UAT setup
        run: |
          # As on the UAT server: settings in deploy/env/uat.env, started through deploy/hrms.sh.
          install -m 600 /dev/null deploy/env/uat.env
          cat > deploy/env/uat.env <<EOF
          HRMS_ENVIRONMENT=uat
          DOMAIN=http://localhost
          APP_DB_URL=jdbc:postgresql://db:5432/hrms
          APP_DB_OWNER_USER=dbmasteruser
          APP_DB_OWNER_PASSWORD=$(openssl rand -hex 16)
          APP_DB_ROLE_PASSWORD=$(openssl rand -hex 16)
          DB_SUPERUSER_PASSWORD=$(openssl rand -hex 16)
          APP_SUPERADMIN_EMAIL=admin@example.com
          APP_SUPERADMIN_PASSWORD=ChangeMe-12345
          APP_DATA_KEY=$(openssl rand -base64 32)
          APP_REQUIRE_DATA_KEY=true
          APP_TRUST_FORWARDED_FOR=true
          BACKUP_DIR=./backups
          EOF
          deploy/hrms.sh uat up -d --build --wait --wait-timeout 300

      - name: Check the app, the database login and the backup
        run: |
          set -e
          dc() { deploy/hrms.sh uat "$@"; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/auth/me)" = 401
          curl -sf -X POST http://localhost/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ChangeMe-12345"}' | grep -q token
          # The database is not reachable from outside Docker.
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then echo "PostgreSQL is exposed on the host"; exit 1; fi
          # The app's admin login is set up as on AWS: no superuser, no way around row-level security.
          dc exec -T db psql -U postgres -d hrms -Atc \
            "select count(*) from pg_roles where (rolname = 'dbmasteruser' or rolname like 'app_%') and (rolsuper or rolbypassrls)" | grep -qx 0
          # A backup can be taken, and reads back.
          dc exec -T backup backup.sh now
          dc exec -T backup sh -c 'f=$(ls /backups/hrms-*.dump | tail -1) && pg_restore --list "$f" | grep -q "TABLE DATA auth"'
          dc exec -T backup sh -c 'ls /backups/roles-*.sql > /dev/null'

      - name: Show the logs
        if: always()
        run: deploy/hrms.sh uat logs --no-color | tail -200
