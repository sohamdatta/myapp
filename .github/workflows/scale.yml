name: Scale check

# By hand only (Actions -> Scale check -> Run workflow). Seeds an Organization of 2,000 employees, times the payroll
# calculation, then runs the k6 read load against the application. Budgets (roadmap Q1): payroll calculation of
# 2,000 employees under 60 s, reads p95 under 300 ms. With "enforce" off (the default until the first real figures
# are known) the numbers are printed and kept, and over-budget does not fail the run.
on:
  workflow_dispatch:
    inputs:
      employees:
        description: Number of employees
        default: '2000'
      enforce:
        description: Fail when a budget is exceeded
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Seed the Organization and time the payroll calculation
        working-directory: backend
        env:
          SCALE_TEST: 'true'
          SCALE_EMPLOYEES: ${{ inputs.employees }}
          SCALE_WARN_ONLY: ${{ inputs.enforce && 'false' || 'true' }}
        run: mvn -B -ntp test -Dtest=PayrollScaleTest -Djacoco.skip=true | tee ../scale-payroll.log

      - name: Build the application
        working-directory: backend
        run: mvn -B -ntp -DskipTests -Djacoco.skip=true package

      - name: Start the application on the seeded database
        env:
          APP_DB_URL: jdbc:postgresql://localhost:5432/hrms_test_scale
          APP_DB_OWNER_USER: postgres
          APP_DB_OWNER_PASSWORD: postgres
          APP_DB_ROLE_PASSWORD: test-role-password
        run: |
          nohup java -jar backend/target/login-app-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me || true)
            if [ "$code" = "401" ]; then echo "backend is up"; exit 0; fi
            sleep 2
          done
          echo "backend did not start"; cat backend.log; exit 1

      - uses: grafana/setup-k6-action@v1
      - name: Read load
        env:
          BASE_URL: http://localhost:8080
          EMAIL: hr@scale.test
          PASSWORD: correct-horse-battery
          THRESHOLDS: ${{ inputs.enforce && 'enforce' || 'warn' }}
        run: k6 run perf/k6/reads.js | tee scale-reads.log

      - name: Summary
        if: always()
        run: |
          { echo '### Scale check'; echo; grep '^SCALE' scale-payroll.log || echo 'no payroll line'; echo; echo '```'; grep -E 'http_req_duration|http_req_failed|checks' scale-reads.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scale-logs
          path: |
            scale-payroll.log
            scale-reads.log
            backend.log
          retention-days: 14
