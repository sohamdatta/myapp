# Sample chrony settings for the HRMS servers: time from the Government of India sources.
# CERT-In (28 April 2022) asks every system's clock to be synchronised to the NTP servers of the
# National Informatics Centre (NIC) or the National Physical Laboratory (NPL), or to servers traceable to them.
#
# Put this in /etc/chrony/chrony.conf (Ubuntu), then: sudo systemctl restart chrony
# Check with: deploy/ntp/check-time-sync.sh

server samay1.nic.in iburst
server samay2.nic.in iburst
server time.nplindia.org iburst
server time.nplindia.in iburst

# Step the clock at start-up if it is far off; afterwards only slew it.
makestep 1.0 3
driftfile /var/lib/chrony/chrony.drift
rtcsync
