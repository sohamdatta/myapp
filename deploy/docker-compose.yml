# The whole app on one server: the backend and the Caddy web server. The database is
# separate (a managed PostgreSQL 16), reached with the environment's settings file.
#
# Run it through deploy/hrms.sh, which picks the environment's settings file and compose files:
#   deploy/hrms.sh production up -d --build
# Plain `docker compose -f deploy/docker-compose.yml ...` still works, reading deploy/.env (as CI does).
services:
  app:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args: &version_args
        APP_VERSION: ${HRMS_VERSION:-dev}
        APP_COMMIT: ${HRMS_COMMIT:-dev}
        APP_BUILT: ${HRMS_BUILT:-}
    # deploy/hrms.sh sets HRMS_ENV_FILE to env/<environment>.env.
    env_file: ${HRMS_ENV_FILE:-.env}
    # Keep the JVM inside its share of the 4 GB server: heap (60% of this) plus metaspace, stacks and code cache.
    # Without a limit the heap is sized from the whole host and the app can crowd out the web proxy.
    mem_limit: 2560m
    restart: unless-stopped
    healthcheck:
      # Signed out, the "who am I" call answers 401: the app and its database are up.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/auth/me HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 401 '"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args: *version_args
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the environment's settings file (deploy/env/<environment>.env)}
      DEVICE_PORT: ${DEVICE_PORT:-8081}
    ports:
      - "80:80"
      - "443:443"
      - "${DEVICE_PORT:-8081}:${DEVICE_PORT:-8081}"   # biometric devices that cannot use HTTPS
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - caddy_data:/data      # the HTTPS certificates; keep this volume
      - caddy_config:/config
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
