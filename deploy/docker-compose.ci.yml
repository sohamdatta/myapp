# For CI only: adds a PostgreSQL 16 whose app login is NOT a superuser, as on AWS
# Lightsail or RDS, so the deployment is tested the way it will run.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up -d --build --wait
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ci-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "hrms"]
      interval: 2s
      retries: 30
  app:
    depends_on:
      db:
        condition: service_healthy
