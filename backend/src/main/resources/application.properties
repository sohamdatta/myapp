server.port=8080

# PostgreSQL. The owner account runs the migrations at startup and creates the
# three application roles (app_platform, app_auth, app_tenant), which the
# application then uses for all other work.
app.db.url=${APP_DB_URL:jdbc:postgresql://localhost:5432/hrms}
app.db.owner.user=${APP_DB_OWNER_USER:postgres}
app.db.owner.password=${APP_DB_OWNER_PASSWORD:postgres}
app.db.role-password=${APP_DB_ROLE_PASSWORD:dev-only-change-me}

# The first Super Admin, created only when the platform has no platform users.
# Change both before any real use.
app.superadmin.email=${APP_SUPERADMIN_EMAIL:admin@example.com}
app.superadmin.password=${APP_SUPERADMIN_PASSWORD:ChangeMe-12345}
