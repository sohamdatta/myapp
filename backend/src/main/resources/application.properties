server.port=8080

# PostgreSQL. The owner account runs the migrations at startup and creates the
# three application roles (app_platform, app_auth, app_tenant), which the
# application then uses for all other work.
app.db.url=${APP_DB_URL:jdbc:postgresql://localhost:5432/hrms}
app.db.owner.user=${APP_DB_OWNER_USER:postgres}
app.db.owner.password=${APP_DB_OWNER_PASSWORD:postgres}
app.db.role-password=${APP_DB_ROLE_PASSWORD:dev-only-change-me}

# The first Super Admin, created only when the platform has no platform users.
# Change both before any real use.
app.superadmin.email=${APP_SUPERADMIN_EMAIL:admin@example.com}
app.superadmin.password=${APP_SUPERADMIN_PASSWORD:ChangeMe-12345}

# Attendance: set to true only when the app runs behind a proxy that sets
# X-Forwarded-For (the office-network punch check then uses that address).
app.trust-forwarded-for=${APP_TRUST_FORWARDED_FOR:false}

# Encryption of PAN, bank account numbers and documents: 32 random bytes, base64
# (make one with: openssl rand -base64 32). Without it the app uses a fixed
# development key and says so in the log; set APP_REQUIRE_DATA_KEY=true in
# production so it refuses to start instead. Keep a copy of the key somewhere
# safe: values encrypted with a lost key cannot be read again.
# To rotate: give the new key a new id, and put the old one in APP_DATA_KEY_PREVIOUS as id:key.
app.data-key=${APP_DATA_KEY:}
app.data-key.id=${APP_DATA_KEY_ID:1}
app.data-key.previous=${APP_DATA_KEY_PREVIOUS:}
app.data-key.required=${APP_REQUIRE_DATA_KEY:false}
