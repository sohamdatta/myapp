server.port=8080

# PostgreSQL. The defaults match the database that runs inside the codespace
# (see .devcontainer/docker-compose.yml). Override with environment variables elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myapp}
spring.datasource.username=${DB_USERNAME:myapp}
spring.datasource.password=${DB_PASSWORD:myapp}

# Runs schema.sql at startup. It only creates tables that do not exist yet.
spring.sql.init.mode=always

# Demo account, added to the users table at startup if it is not already there.
# Change these, or set the APP_DEMO_USERNAME / APP_DEMO_PASSWORD environment variables.
app.demo.username=${APP_DEMO_USERNAME:admin}
app.demo.password=${APP_DEMO_PASSWORD:admin123}
