# jqwik (property-based tests). A failing property prints its seed; rerun with
# -Djqwik.seeds.whenfixed=... or paste the seed into @Property(seed = "...") to reproduce it.
# The database of past failures stays under target/ so it is never committed.
jqwik.database=target/jqwik-database
jqwik.reporting.onlyfailures=true
jqwik.tries.default=1000
