# Frozen rules (FreezingArchRule) compare today's violations with the committed store, so only NEW
# violations fail. Fix an old violation, then delete its line from the store (or run with
# -Darchunit.freeze.refreeze=true after a deliberate change) and say why in the pull request.
freeze.store.default.path=src/test/resources/archunit-store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
freeze.refreeze=false
